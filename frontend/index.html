<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>QR Code Generator</title>
      <style>
        body {
          font-family: Arial, Helvetica, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          margin: 0;
        }

        #qrcode {
          margin-bottom: 20px;
          width: 256px;
          height: 256px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        #controls {
          display: flex;
          gap: 10px;
        }

        #text {
          padding: 5px;
        }

        #generateButton {
          padding: 5px 10px;
          cursor: pointer;
        }
      </style>
</head>
<body>
  <img id="qrcode">
  <div id="controls">
    <input type="text" placeholder="Enter text">
      <button id="generateButton">Generate QR Code</button>
  </div>

  <script type="module">
    import { initializeQRGenerator } from './src/main.tsx';
    document.addEventListener('DOMContentLoaded', initializeQRGenerator);
  </script>
</body>
</html>
